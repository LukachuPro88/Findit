[package]
name = "findit-rs"
version = "2.3.0"
edition = "2024"
description = "A fast, lightweight command-line filesystem search tool"
license = "MIT"
repository = "https://github.com/LukachuPro88/findit"
readme = "README.md"
documentation = "https://docs.rs/findit-rs"

[lib]
name = "findit"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
eframe = "0.34.2"
rayon = "1.10"
tempfile = "3"
walkdir = "2.5.0"
